<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 서울영동 어와나 그랑프리 레이스 매니저</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes yellow-flash {
      0%, 100% { background-color: #ffffff; }
      50% { background-color: #fef08a; }
    }
    .sensor-flash {
      animation: yellow-flash 0.9s ease-in-out;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">
  <!-- 상단 화이트 헤더 -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-3 h-7 bg-indigo-600 rounded-sm"></div>
      <div>
        <h1 class="text-xl font-black text-slate-900 tracking-tight">AWANA GRAND PRIX 2026</h1>
        <p class="text-xs text-slate-500 font-medium">서울영동교회 어와나 그랑프리 경기 운영 시스템</p>
      </div>
    </div>

    <!-- 헤더 우측 컨트롤 버튼군 -->
    <div class="flex items-center flex-wrap gap-2 text-xs font-semibold">
      <span id="serialStatusBadge" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-500 flex items-center gap-1.5 transition">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span>타이머 미연결</span>
      </span>

      <button onclick="connectTimerSerial()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 rounded-lg transition">
        타이머 연결
      </button>

      <button onclick="simulateTimerSignal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 rounded-lg transition">
        가상 테스트
      </button>

      <div class="h-4 w-px bg-slate-300 mx-1"></div>

      <!-- 탭 버튼 -->
      <button id="tabBtn-qualifying" onclick="switchTab('qualifying')" class="px-3.5 py-1.5 bg-slate-900 text-white font-bold rounded-lg shadow-sm transition">
        예선 레이스
      </button>
      <button id="tabBtn-finals" onclick="switchTab('finals')" class="px-3.5 py-1.5 bg-white hover:bg-slate-100 text-slate-600 font-medium rounded-lg border border-slate-200 transition">
        결선 레이스 (4회)
      </button>
      <button onclick="runTop4Sync()" class="px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg transition">
        결선 진출 발표
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6 flex-1">

    <!-- 1. 예선전 화면 -->
    <section id="view-qualifying" class="space-y-6">
      
      <!-- 상단 조 컨트롤 바 -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div>
          <span class="text-xs text-slate-400 font-bold block">현재 경기 회차 (예선)</span>
          <div class="flex items-center gap-3 mt-1">
            <h2 id="heatTitle" class="text-2xl font-black text-slate-900">제 1 조 (1차 주행)</h2>
            <span class="px-2.5 py-0.5 bg-slate-100 text-slate-700 font-mono text-xs rounded-lg border border-slate-300 font-bold">
              노랑 - 초록 - 파랑 - 빨강
            </span>
          </div>
        </div>

        <div class="flex items-center flex-wrap gap-2">
          <button onclick="handleRerun('qualifying')" class="px-3 sm:px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-extrabold rounded-xl text-xs sm:text-sm transition flex items-center gap-1 shadow-sm">
            재경기 (기록 취소)
          </button>
          <button onclick="prevHeat()" class="px-3 sm:px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs sm:text-sm transition">
            ◀ 이전 경기
          </button>
          <span id="heatIndicator" class="font-mono font-extrabold text-sm px-3 text-slate-600">1 / 1</span>
          <button onclick="nextHeat()" class="px-3 sm:px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs sm:text-sm shadow transition">
            다음 경기 ▶
          </button>
        </div>
      </div>

      <!-- 4개 레인 실시간 카드 그리드 (노·초·파·빨) -->
      <div id="laneGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

      <!-- 기록 저장 및 이동 바 -->
      <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span id="syncStatusText" class="text-xs text-slate-500 font-semibold">데이터 준비 완료</span>
        <div class="flex items-center gap-3">
          <button onclick="saveCurrentHeat(false)" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition">
            기록 저장
          </button>
          <button onclick="saveCurrentHeat(true)" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow transition flex items-center gap-1">
            <span>저장 후 다음 레이스 ➔</span>
          </button>
        </div>
      </div>

      <!-- 전체 예선 집계표 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-base text-slate-800">전체 예선 경기 실시간 집계표</h3>
            <p class="text-xs text-slate-400">구글 시트에 저장된 기록이 실시간으로 반영됩니다.</p>
          </div>
          <button onclick="syncFromGoogleSheets()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200 transition">
            시트 데이터 동기화
          </button>
        </div>
        <div class="overflow-x-auto max-h-96">
          <table class="w-full text-left text-xs border-collapse">
            <thead class="bg-slate-50 sticky top-0 text-slate-600 font-bold border-b border-slate-200">
              <tr>
                <th class="p-3">차량번호</th>
                <th class="p-3">부서</th>
                <th class="p-3">이름</th>
                <th class="p-3 text-center">예선 1차 (초)</th>
                <th class="p-3 text-center">예선 2차 (초)</th>
                <th class="p-3 text-center text-blue-600">최고기록 (MIN)</th>
                <th class="p-3 text-center">상태</th>
              </tr>
            </thead>
            <tbody id="qualifyingTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 2. 결선전 화면 -->
    <section id="view-finals" class="hidden space-y-6">
      <div class="bg-white p-5 rounded-2xl border border-amber-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div>
          <span class="text-xs text-amber-600 font-bold block">최종 결선 레이스 (4개 레인 공정 순환)</span>
          <div class="flex items-center gap-3 mt-1">
            <h2 id="finalHeatTitle" class="text-2xl font-black text-slate-900">결선 제 1차 주행</h2>
            <span class="px-2.5 py-0.5 bg-amber-50 text-amber-800 font-mono text-xs rounded-lg border border-amber-300 font-bold">
              노랑 - 초록 - 파랑 - 빨강
            </span>
          </div>
        </div>

        <div class="flex items-center flex-wrap gap-2">
          <button onclick="handleRerun('finals')" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-bold rounded
